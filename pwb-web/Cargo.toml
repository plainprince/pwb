[package]
name = "pwb-web"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-only"
description = "PlainWeb layer 1: author, parse, bundle, and losslessly compress sites into plain artifacts."

[lib]
name = "pwb_web"
path = "src/lib.rs"

[[bin]]
name = "pwb-web"
path = "src/main.rs"

[dependencies]
pwb-core = { path = "../pwb-core" }
lightningcss = { version = "1.0.0-alpha.72", features = ["bundler"] }
hex = "0.4"
serde_json = "1"

# Compression lives in `pwb-core::wire` (PWBZ container: zlib + BLAKE3), so the
# browser, node, and CLI all read and write the same format.
