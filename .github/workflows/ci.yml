name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check (cargo fmt --all --check)
        run: cargo fmt --all --check

      - name: Lint (cargo clippy --workspace --all-targets -- -D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (cargo test --workspace)
        run: cargo test --workspace

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage (cargo llvm-cov --workspace)
        run: cargo llvm-cov --workspace --html --output-dir target/llvm-cov-html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: llvm-cov-html
          path: target/llvm-cov-html/html
          retention-days: 7

  # Windows is a supported host, not an afterthought: default state paths
  # resolve through $USERPROFILE when $HOME is unset, tests use the OS temp
  # directory, and the whole workspace (including the C dependencies ring,
  # blake3, QuickJS, and tinyfiledialogs) has to build and pass the same
  # zero-warning gate there. Format and coverage stay on the Linux job —
  # neither depends on the platform.
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Lint (cargo clippy --workspace --all-targets -- -D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (cargo test --workspace)
        # --no-fail-fast keeps one platform-specific failure from hiding every
        # test binary that would have run after it.
        run: cargo test --workspace --no-fail-fast
