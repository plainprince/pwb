[package]
name = "pwb-node"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-only"
description = "PlainWeb layer 3: a serverless network node — host, search, verify, identity, and system domains."

[lib]
name = "pwb_node"
path = "src/lib.rs"

[[bin]]
name = "pwb-node"
path = "src/main.rs"

[dependencies]
pwb-core = { path = "../pwb-core" }
pwb-web = { path = "../pwb-web" }
tokio = { version = "1.0", features = ["full"] }
hex = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["native-certs"] }
