[package]
name = "pwb-browser"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-only"
description = "PlainWeb layer 2: open a plain artifact, decompile it, build a DOM, and render it."

[lib]
name = "pwb_browser"
path = "src/lib.rs"

[[bin]]
name = "pwb-browser"
path = "src/main.rs"

[features]
# CORS is enforced by default on `fetch`: same-origin file/relative requests
# are always allowed, while cross-origin http(s) requests require
# `Access-Control-Allow-Origin: *`. `permissive-cors` opts out for local
# development against APIs that do not send the header.
permissive-cors = []

[dependencies]
pwb-core = { path = "../pwb-core" }
pwb-node = { path = "../pwb-node" }
pwb-web = { path = "../pwb-web" }
tokio = { version = "1.0", features = ["full"] }
hex = "0.4"
tiny-skia = { version = "0.12", features = ["png-format"] }
winit = "0.30"
softbuffer = "0.4"
ab_glyph = "0.2"
rquickjs = "0.12"
toml = "0.8"
# Wayland-first clipboard on Linux (`wayland-data-control`), falling back to
# X11. Keeping one handle alive also lets clipboard managers read the contents.
arboard = { version = "3.6", features = ["wayland-data-control"] }
serde_json = "1"
ureq = { version = "2.12", features = ["native-certs"] }
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots", "url"] }
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }

# Native dialogs on Linux/Windows: tinyfiledialogs maps alert/confirm/prompt
# to zenity/kdialog/yad (Linux) or TaskDialog (Windows), and we fall back to
# console output when no display backend is available.
[target.'cfg(not(target_os = "macos"))'.dependencies]
tinyfiledialogs = "3.9"

# Native OS dialogs (alert/confirm/prompt) and context menu on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = ["NSMenu", "NSMenuItem", "NSView", "NSResponder", "NSAlert", "NSButton", "NSControl", "NSTextField"] }
objc2-foundation = "0.2.2"
raw-window-handle = "0.6"
